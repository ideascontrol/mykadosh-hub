<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ingresar · Gestión Documental · Ideas Control</title>
<link rel="icon" href="assets/img/ideascontrol.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/gd.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:var(--fondo);margin:0;padding:16px;box-sizing:border-box}
.login{width:100%;max-width:400px;background:var(--papel);border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.login .franja{height:5px;background:var(--grad)}
.login form{padding:28px 26px 24px;display:grid;gap:14px}
.login img{height:46px;justify-self:start}
.login h1{font-size:20px;margin:6px 0 0;color:var(--tinta)}
.login p{margin:0;color:var(--suave);font-size:13.5px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--suave)}
.login input[type=text],.login input[type=password]{font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--linea);border-radius:10px;color:var(--tinta)}
.login input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(14,118,188,.12)}
.login .rec{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--texto)}
.login .rec input{width:18px;height:18px;accent-color:var(--azul)}
.login .btn{justify-content:center;padding:12px;font-size:15px}
.login .err{color:#b42318;background:#fdecec;border-radius:9px;padding:9px 12px;font-size:13px}
.login .pie{font-size:11.5px;color:var(--suave);text-align:center;padding:0 20px 18px}
</style>
</head>
<body>
<div class="login">
  <div class="franja"></div>
  <form id="f" autocomplete="on">
    <img src="assets/img/ideascontrol.webp" alt="Ideas Control Equipos y Soluciones S.A.S.">
    <div><h1>Gestión Documental</h1><p>Ingrese con el usuario y la clave del portal.</p></div>
    <label>Usuario<input type="text" id="u" name="username" autocomplete="username" required autofocus></label>
    <label>Clave<input type="password" id="c" name="password" autocomplete="current-password" required></label>
    <label class="rec"><input type="checkbox" id="r"> Recordarme en este equipo (30 días; si no, 12 horas)</label>
    <div class="err" id="e" hidden>Usuario o clave incorrectos.</div>
    <button class="btn pri">Ingresar</button>
  </form>
  <div class="pie">Ideas Control Equipos y Soluciones S.A.S. · Uso interno · Personal autorizado</div>
</div>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  var volver = new URLSearchParams(location.search).get('volver') || 'index.html';
  if (!/^[\w\-./]+(\.html)?([?#].*)?$/.test(volver) || /^\/|\/\/|\.\./.test(volver)) volver = 'index.html';  // solo rutas internas
  if (GDAuth.usuarioActual()) { location.replace(volver); return; }
  document.getElementById('f').onsubmit = function (ev) {
    ev.preventDefault();
    var ok = GDAuth.iniciarSesion(document.getElementById('u').value, document.getElementById('c').value, document.getElementById('r').checked);
    if (ok) location.replace(volver);
    else { document.getElementById('e').hidden = false; document.getElementById('c').value = ''; document.getElementById('c').focus(); }
  };
})();
</script>
</body>
</html>
