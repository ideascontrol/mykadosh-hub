<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de herramientas empresariales · Ideas Control</title>
<meta name="description" content="Herramientas gratuitas de Ideas Control: diagnósticos, calculadoras y soluciones de Tiempo y Asistencia para tomar mejores decisiones.">
<link rel="icon" href="/ideascontrol/assets/ideascontrol.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --teal: #159090; --tinta: #1D2B36; --gris: #5B6770; --suave: #8A96A0; --linea: #E3E8EC; --fondo: #F4F7F9; --blanco: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, Arial, sans-serif; color: var(--tinta); background: var(--fondo); -webkit-font-smoothing: antialiased; }
  .caja { max-width: 980px; margin: 32px auto; background: var(--blanco); border: 1px solid var(--linea); border-radius: 16px; padding: 28px 28px 34px; box-shadow: 0 8px 30px rgba(29, 43, 54, .05); }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca img { height: 34px; }
  h1 { margin: 0; color: var(--teal); font-size: 26px; font-weight: 700; letter-spacing: -.2px; }
  h2 { margin: 14px 0 4px; font-size: 18px; font-weight: 600; }
  .lema { margin: 0 0 20px; font-size: 13.5px; color: var(--gris); }
  .buscar { width: 100%; font: inherit; font-size: 15px; padding: 12px 18px; border: 1px solid #D5DCE1; border-radius: 999px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .buscar:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(21, 144, 144, .12); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 20px; }
  .chips button { font: inherit; font-size: 13.5px; font-weight: 500; padding: 6px 14px; border: 1px solid #D5DCE1; border-radius: 999px; background: var(--blanco); color: var(--tinta); cursor: pointer; transition: all .15s; }
  .chips button:hover { border-color: var(--tinta); }
  .chips button.on { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border: 1px solid var(--linea); border-radius: 12px; text-decoration: none; color: inherit; background: var(--blanco); transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); border-color: var(--teal); box-shadow: 0 8px 22px rgba(21, 144, 144, .12); }
  .card svg { width: 22px; height: 22px; color: var(--teal); margin-bottom: 4px; }
  .card h3 { margin: 0; font-size: 16.5px; font-weight: 700; }
  .card p { margin: 0; font-size: 13px; color: var(--gris); line-height: 1.45; }
  .card .cat { margin-top: auto; padding-top: 8px; font-size: 12.5px; color: var(--suave); }
  .card .ir { font-size: 12.5px; font-weight: 600; color: var(--teal); opacity: 0; transition: opacity .15s; }
  .card:hover .ir { opacity: 1; }
  .vacio { grid-column: 1 / -1; text-align: center; padding: 30px; color: var(--gris); font-size: 14px; }
  .pie { max-width: 980px; margin: 0 auto 30px; padding: 0 28px; font-size: 12px; color: var(--suave); text-align: center; }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .caja { margin: 0; border-radius: 0; border-width: 0 0 1px; padding: 22px 16px 26px; } .grid { grid-template-columns: 1fr; } .pie { padding: 0 16px; } }
</style>
</head>
<body>
<main class="caja">
  <h1>Ideas Control</h1>
  <h2>Centro de herramientas empresariales</h2>
  <p class="lema">Del dato a la decisión. De la decisión al resultado.</p>
  <input class="buscar" id="q" type="search" placeholder="Buscar una herramienta..." aria-label="Buscar una herramienta" autocomplete="off">
  <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
  <div class="grid" id="grid"></div>
</main>
<p class="pie">Ideas Control Equipos y Soluciones S.A.S. · Herramientas gratuitas para su empresa</p>
<script>
/* Herramientas públicas de Ideas Control. Para agregar una: sume una entrada aquí (icono: diag, huella, calc, vision). */
const HERRAMIENTAS = [
  { nombre: 'Diagnóstico de Madurez', texto: 'Evalúa en 10 preguntas tu gestión de Tiempo y Asistencia.', cat: 'Diagnósticos', url: '/ideascontrol/DiagnosticoMadurezTyA/', icono: 'diag' },
  { nombre: 'Costo del Ausentismo', texto: 'Calcula el impacto económico de la hora ausente.', cat: 'Calculadoras', url: '/ideascontrol/CostoHoraAusente/', icono: 'calc' },
  { nombre: 'Piloto de Tiempo y Asistencia', texto: 'Digitaliza y optimiza el control de asistencia de tus colaboradores.', cat: 'Tiempo y Asistencia', url: '/ideascontrol/PilotoTyA/', icono: 'huella' },
  { nombre: 'TimeVision', texto: 'Convierte las marcaciones en decisiones: costo, capacidad y cumplimiento.', cat: 'Productividad', url: '/ideascontrol/TimeVision/', icono: 'vision' }
];
const ICONOS = {
  diag: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/><path d="M15 8h4v4"/>',
  calc: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/>',
  huella: '<path d="M12 11v3a6 6 0 0 1-1 3.3"/><path d="M8.5 9.5A3.5 3.5 0 0 1 15.5 10v2"/><path d="M6 8a7 7 0 0 1 12.5 1.5"/><path d="M5.5 13a14 14 0 0 0 .5 3"/><path d="M15.5 14.5a10 10 0 0 1-1.5 5"/><path d="M18.8 12.5c0 2-.3 3.8-.8 5.5"/>',
  vision: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let cat = '', q = '';
function pintar() {
  const t = norm(q).split(/\s+/).filter(Boolean);
  const lista = HERRAMIENTAS.filter((h) => (!cat || h.cat === cat) && t.every((x) => norm(h.nombre + ' ' + h.texto + ' ' + h.cat).includes(x)));
  document.getElementById('grid').innerHTML = lista.length ? lista.map((h) =>
    '<a class="card" href="' + esc(h.url) + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONOS[h.icono] || '') + '</svg>' +
    '<h3>' + esc(h.nombre) + '</h3><p>' + esc(h.texto) + '</p><span class="cat">' + esc(h.cat) + '</span></a>').join('')
    : '<div class="vacio">No encontramos herramientas con ese criterio.</div>';
}
const cats = [...new Set(HERRAMIENTAS.map((h) => h.cat))];
document.getElementById('chips').innerHTML = ['Todas'].concat(cats).map((c, i) => '<button type="button" data-c="' + (i ? esc(c) : '') + '"' + (i ? '' : ' class="on"') + '>' + esc(c) + '</button>').join('');
document.querySelectorAll('#chips button').forEach((b) => { b.onclick = () => { cat = b.dataset.c; document.querySelectorAll('#chips button').forEach((x) => x.classList.toggle('on', x === b)); pintar(); }; });
document.getElementById('q').addEventListener('input', (e) => { q = e.target.value; pintar(); });
pintar();
</script>
</body>
</html>
