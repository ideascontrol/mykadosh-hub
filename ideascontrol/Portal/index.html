<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de microapps · Ideas Control</title>
<link rel="icon" href="/ideascontrol/assets/ideascontrol.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/ic.css?v=0.4.0">
<style>
  .pt-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: auto; padding-top: 6px; }
  .pt-datos, .pt-rol, .pt-id { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .pt-datos.sp { background: rgba(14,118,188,.10); color: var(--ic-azul); }
  .pt-datos.gh { background: rgba(201,162,39,.16); color: #8A6D0F; }
  .pt-datos.pa { background: rgba(122,79,176,.12); color: #6A3FA0; }
  .pt-pend { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(183,121,31,.16); color: #8A5A10; }
  .pt-rol { background: rgba(31,138,76,.12); color: var(--ic-ok); }
  .pt-id { color: var(--ic-gris-claro); padding-left: 0; margin-left: auto; }
  .pt-nota { font-size: 12px !important; color: var(--ic-gris-claro) !important; }
  .ic-card.pt-sin { opacity: .7; }
  .pt-hoy-caja { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; background: var(--ic-blanco); border: 1px solid var(--ic-borde); border-left: 4px solid var(--ic-teal);
    border-radius: var(--ic-radio); padding: 12px 16px; box-shadow: var(--ic-sombra); font-size: 14px; }
  .pt-hoy-caja b { color: var(--ic-teal); }
  .pt-hoy-caja em { font-style: normal; color: var(--ic-err); font-weight: 700; }
  .pt-hoy-caja a { margin-left: auto; font-weight: 600; text-decoration: none; }
  .pt-publicas { display: flex; flex-wrap: wrap; gap: 8px; }
  .pt-publicas a { background: var(--ic-blanco); border: 1px solid var(--ic-borde); border-radius: 999px; padding: 7px 14px; font-size: 13px; text-decoration: none; color: var(--ic-tinta); }
  .pt-publicas a:hover { border-color: var(--ic-azul); color: var(--ic-azul); }
</style>
</head>
<body>
<header class="ic-header" id="encabezado" hidden></header>
<main class="ic-main" id="contenido"></main>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
<script src="../shared/js/auth.js?v=0.4.0"></script>
<script src="../shared/js/graph.js?v=0.4.0"></script>
<script src="../shared/js/ui.js?v=0.4.0"></script>
<script src="js/config.js?v=0.1.12"></script>
<script src="js/matriz.js?v=0.1.1"></script>
<script src="js/portal.js?v=0.1.12"></script>
</body>
</html>
