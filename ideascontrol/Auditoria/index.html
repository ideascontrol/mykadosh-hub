<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Auditoría de registros · Ideas Control</title>
<link rel="icon" href="/ideascontrol/assets/ideascontrol.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/ic.css?v=0.4.1">
<style>
  .au-filtros { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: end; }
  .au-filtros label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ic-gris); }
  .au-filtros .ancho { grid-column: span 2; }
  .au-prog { margin: 14px 0; } .au-prog p { margin: 6px 0 0; font-size: 13px; color: var(--ic-gris); }
  .au-res { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .au-res span { background: #fff; border: 1px solid var(--ic-borde); border-radius: 10px; padding: 8px 12px; font-size: 13px; } .au-res b { font-size: 18px; display: block; color: var(--ic-azul); }
  .au-tabla { table-layout: fixed; width: 100%; }
  .au-tabla col.c-f { width: 118px; } .au-tabla col.c-u { width: 170px; } .au-tabla col.c-a { width: 92px; } .au-tabla col.c-r { width: 130px; } .au-tabla col.c-l { width: 130px; }
  .au-tabla td { overflow-wrap: anywhere; vertical-align: top; } .au-tabla td.f { white-space: normal !important; }
  .au-tabla td:not(:last-child) small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ic-tabla td.f { white-space: nowrap; font-size: 13px; } .ic-tabla td small { display: block; color: var(--ic-gris-claro); font-size: 12px; }
  .au-acc { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .au-acc.c { background: rgba(21,144,144,.13); color: #0F6F6F; } .au-acc.m { background: rgba(14,118,188,.11); color: var(--ic-azul); } .au-acc.e { background: rgba(192,57,43,.10); color: #A3301F; }
  .au-cam { margin: 0; padding: 0; list-style: none; font-size: 13px; } .au-cam li { margin: 2px 0; word-break: break-word; }
  .au-cam i { font-style: normal; color: var(--ic-gris); } .au-cam s { color: #A3301F; text-decoration: line-through; } .au-cam ins { color: #0F6F6F; text-decoration: none; font-weight: 600; }
  details.au-mas summary { cursor: pointer; color: var(--ic-azul); font-size: 12px; font-weight: 600; }
  .au-nota { background: #FBF6E5; border: 1px solid #EBD9A0; border-radius: 10px; padding: 10px 12px; color: #6B5310; font-size: 14px; margin: 12px 0; }
  .au-ok { background: rgba(21,144,144,.08); border: 1px solid rgba(21,144,144,.3); border-radius: 10px; padding: 10px 12px; color: #0F5F5F; font-size: 14px; margin: 12px 0; }
  @media (max-width: 900px) { .au-tabla { table-layout: auto; } .au-tabla col { width: auto !important; } .au-filtros { grid-template-columns: 1fr 1fr; } .au-filtros .ancho { grid-column: span 2; } .ic-tabla .om { display: none; } }
</style>
</head>
<body>
<header class="ic-header" id="encabezado" hidden></header>
<main class="ic-main" id="contenido"></main>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
<script src="../shared/js/auth.js?v=0.4.0"></script>
<script src="../shared/js/graph.js?v=0.4.3"></script>
<script src="../shared/js/ui.js?v=0.5.4"></script>
<script src="../shared/js/volver.js?v=0.1.6"></script>
<script src="js/config.js?v=0.2.1"></script>
<script src="js/app.js?v=0.2.1"></script>
</body>
</html>
